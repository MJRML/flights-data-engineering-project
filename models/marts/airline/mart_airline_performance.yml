version: 2

models:
  - name: mart_airline_performance
    description: Monthly airline performance metrics.

    columns:
      - name: airline_key
        description: Surrogate key for the airline.
        tests:
          - not_null

      - name: airline_code
        description: Airline code.
        tests:
          - not_null

      - name: year
        description: Calendar year.
        tests:
          - not_null

      - name: month
        description: Calendar month.
        tests:
          - not_null

      - name: total_flights
        description: Total flights for the airline in the month.
        tests:
          - not_null
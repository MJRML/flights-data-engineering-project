version: 2

models:
  - name: dim_dates
    description: Date dimension containing one record per calendar date.

    columns:
      - name: date_key
        description: Surrogate key for the date.
        data_tests:
          - not_null
          - unique

      - name: date
        description: Calendar date.
        data_tests:
          - not_null
          - unique

      - name: year
        description: Calendar year.
        data_tests:
          - not_null

      - name: month
        description: Calendar month number.
        data_tests:
          - not_null

      - name: day
        description: Day of the month.
        data_tests:
          - not_null

      - name: day_of_week
        description: ISO day of the week (1 = Monday, 7 = Sunday).
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]

      - name: is_weekend
        description: Indicates whether the date falls on a weekend.
        data_tests:
          - not_null